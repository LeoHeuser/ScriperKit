# Default configuration of the screenshot runner, read by screenshots.sh before the app's own
# configuration. An app overrides any value by setting it again in its screenshots.conf.
# See Documentation/ScriperKit.md.

# Devices: export folder | simulator device type | displays
# No runtime: a new simulator gets the newest installed runtime that supports the device type,
# so a run needs no change here when a runtime is added to or removed from the Mac.
# Displays is empty for a device with one screen. A device with several lists each as
# name=WIDTHxHEIGHT; the name becomes the file suffix.
# iPhone Duo boots folded and cannot be unfolded from the command line, so only its outer screen
# is captured. Add "inner=2007x2853" once it can be unfolded.
DEVICES=(
  "iPhone|com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro-Max|"
  "iPad|com.apple.CoreSimulator.SimDeviceType.iPad-Pro-13-inch-M5-12GB|"
  "iPhone Duo|com.apple.CoreSimulator.SimDeviceType.iPhone-Duo|outer=1398x2034"
)

# The store locales of App Store Connect. They only name the export folders: a run covers every
# language the built app is localized in, read from its .lproj folders, and derives system
# language, region, and keyboard from the simulator runtime. An app language matches every store
# locale of that language its own region and script allow, such as en-US, en-GB, en-AU, and en-CA
# for "en". A language without a store locale here keeps its own code as the folder name.
STORE_LOCALES=(
  ar-SA ca cs da de-DE el en-AU en-CA en-GB en-US es-ES es-MX fi fr-CA fr-FR he hi hr hu id it ja
  ko ms nl-NL no pl pt-BR pt-PT ro ru sk sv th tr uk vi zh-Hans zh-Hant
)

# System appearance of every simulator: "dark" or "light".
APPEARANCE="dark"

# Status bar: 9:41 on Tuesday, January 9, Apple's convention, as local wall-clock time.
STATUS_BAR_DATE="2024-01-09 09:41:00"

# Seconds between launching a scene and the first screenshot: covers the launch, a sheet
# animation, and the layout passes after launch.
SCENE_SETTLE_SECONDS=3

# A screenshot counts once it repeats the attempt before it. Attempts and the pause between them
# bound how long a scene may take to settle: up to about 8 more seconds.
CAPTURE_ATTEMPTS=8
CAPTURE_RETRY_SECONDS=1

# A screen whose PNG stays below this many bytes per pixel is blank: still launching, or a display
# that is off. A blank screen compresses to about 0.02. Real scenes measured down to 0.14 in dark
# appearance, but to 0.050 in light appearance: a sparse settings page of flat surfaces.
BLANK_DISPLAY_MAX_BYTES_PER_PIXEL="0.035"
